<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" sizes="76x76" href="light-bootstrap-dashboard/assets/img/apple-icon.png">
    <link rel="icon" type="image/png" href="light-bootstrap-dashboard/assets/img/favicon.ico">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Laboratório de autenticação</title>
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no' name='viewport' />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,200" rel="stylesheet" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css" />
    <link href="light-bootstrap-dashboard/assets/css/bootstrap.min.css" rel="stylesheet" />
    <link href="light-bootstrap-dashboard/assets/css/light-bootstrap-dashboard.css?v=2.0.0" rel="stylesheet" />
    <link href="light-bootstrap-dashboard/assets/css/demo.css" rel="stylesheet" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f4f3ef;
        }

        .login-card {
            max-width: 420px;
            width: 100%;
            padding: 40px;
            border-radius: 6px;
            background: #fff;
            box-shadow: 0 1px 20px 0 rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .login-card .btn {
            width: 100%;
            margin-top: 12px;
        }

        #status {
            margin-top: 18px;
            color: #66615b;
        }

        #logged-in-area {
            display: none;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h4>Laboratório de autenticação</h4>
        <p id="status">Consultando sessão...</p>

        <div id="logged-out-area">
            <a class="btn btn-fill btn-info" href="/oauth/login/google">Entrar com Google</a>
            <a class="btn btn-fill btn-default" href="/oauth/login/github">Entrar com GitHub</a>
        </div>

        <div id="logged-in-area">
            <a class="btn btn-fill btn-success" href="light-bootstrap-dashboard/examples/dashboard.html">Ir para o Dashboard</a>
            <form method="post" action="/oauth/logout">
                <button type="submit" class="btn btn-fill btn-danger">Sair</button>
            </form>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
